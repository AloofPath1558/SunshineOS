<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SunshineOS Wallpaper Generator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#0a0418;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  gap:16px;
}

canvas {
  display:block;
  max-width:95vw;
  max-height:80vh;
  border-radius:10px;
  box-shadow:0 0 60px rgba(245,180,20,0.18);
}

.controls {
  display:flex;
  gap:12px;
  align-items:center;
}

button {
  padding:10px 28px;
  background:#F5B820;
  color:#1A0800;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

button:hover {
  background:#E8A010;
}

select {
  padding:10px;
  border-radius:8px;
  border:none;
  background:#fff;
}

p {
 color:rgba(255,220,100,0.45);
 font-size:13px;
}
</style>
</head>

<body>

<canvas id="wc"></canvas>

<div class="controls">
<select id="mode" onchange="draw()">
  <option value="dark">🌙 Dark Mode</option>
  <option value="light">☀️ Light Mode</option>
</select>

<button onclick="dl()">↓ Download 1920×1080 PNG</button>
</div>

<p>
SunshineOS 1.0 "Leonardus" · aloofpath1558.github.io/SunshineOS
</p>


<script>

const c=document.getElementById("wc");
const g=c.getContext("2d");

const W=1920;
const H=1080;

c.width=W;
c.height=H;


function draw(){

g.clearRect(0,0,W,H);

const light=document.getElementById("mode").value==="light";


// SKY

let bands;

if(light){

bands=[
['#8CC8FF',0,220],
['#A9D8FF',220,180],
['#C7C8FF',400,160],
['#F2B7A0',560,160],
['#FFD27A',720,360]
];

}else{

bands=[
['#06021A',0,155],
['#0E0532',155,105],
['#1C0840',260,90],
['#380D50',350,80],
['#5C1240',430,90],
['#8A2022',520,85],
['#B83C10',605,80],
['#D86A08',685,80],
['#EE9808',765,315]
];

}


bands.forEach(([col,y,h])=>{
g.fillStyle=col;
g.fillRect(0,y,W,h);
});


// SUN

const sx=W/2;
const sy=H*0.755;
const sr=245;


// RAYS

for(let i=0;i<22;i++){

const a=(i/22)*Math.PI*2;
const half=(Math.PI/22)*0.42;

g.beginPath();

g.moveTo(
sx+Math.cos(a-half)*sr,
sy+Math.sin(a-half)*sr
);

g.lineTo(
sx+Math.cos(a)*1350,
sy+Math.sin(a)*1350
);

g.lineTo(
sx+Math.cos(a+half)*sr,
sy+Math.sin(a+half)*sr
);

g.closePath();


if(light)
g.fillStyle=i%2===0?
'rgba(255,210,60,.35)':
'rgba(255,150,20,.18)';
else
g.fillStyle=i%2===0?
'rgba(242,162,14,.52)':
'rgba(198,88,10,.31)';


g.fill();

}


// GLOW

[
[sr*2.6,'rgba(238,168,18,.06)'],
[sr*1.85,'rgba(238,168,18,.09)'],
[sr*1.38,'rgba(250,195,50,.13)']

].forEach(([r,col])=>{

g.beginPath();
g.arc(sx,sy,r,0,Math.PI*2);
g.fillStyle=col;
g.fill();

});


// SUN DISC

g.beginPath();
g.arc(sx,sy,sr,0,Math.PI*2);

g.fillStyle=
light ? "#FFF3B0" : "#FFEDA0";

g.fill();


g.beginPath();
g.arc(sx,sy,sr*.63,0,Math.PI*2);

g.fillStyle="#FFF8D8";
g.fill();



// HILLS

g.beginPath();

g.moveTo(0,H);

g.bezierCurveTo(220,800,520,755,730,818);
g.bezierCurveTo(930,878,1040,778,1240,800);
g.bezierCurveTo(1445,820,1695,790,W,835);

g.lineTo(W,H);
g.closePath();


g.fillStyle=
light ? "#536078" : "#0A041C";

g.fill();



g.beginPath();

g.moveTo(0,H);

g.bezierCurveTo(175,918,375,896,570,938);
g.bezierCurveTo(720,968,912,908,1095,940);
g.bezierCurveTo(1295,972,1498,928,1695,962);
g.bezierCurveTo(1818,988,1898,1003,W,998);

g.lineTo(W,H);
g.closePath();


g.fillStyle=
light ? "#263047" : "#060210";

g.fill();



// STARS (solo dark)

if(!light){

[
[102,53],[258,36],[378,93],[502,26],[612,72],
[718,40],[808,108],[928,20],[1038,63],
[1158,43],[1238,88],[1368,58],
[1458,26],[1568,93],[1658,48],
[1776,33],[1878,103]
].forEach(([x,y])=>{

g.beginPath();
g.arc(x,y,1.4,0,Math.PI*2);
g.fillStyle="rgba(255,252,220,.8)";
g.fill();

});

}



// TEXT

g.textAlign="center";

g.font="bold 92px system-ui";

g.fillStyle=
light ?
"rgba(80,50,10,.85)" :
"rgba(255,238,138,.95)";

g.fillText(
"SunshineOS",
W/2,
328
);


g.font="300 41px system-ui";

g.fillStyle=
light ?
"rgba(90,60,20,.65)" :
"rgba(255,212,95,.52)";


g.fillText(
"1.0 · Leonardus",
W/2,
388
);


}



// DOWNLOAD

function dl(){

const a=document.createElement("a");

a.download=
"SunshineOS-1.0-Leonardus-"+document.getElementById("mode").value+".png";

a.href=c.toDataURL("image/png");

a.click();

}


draw();

</script>

</body>
</html>
